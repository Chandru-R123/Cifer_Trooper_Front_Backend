<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Service Detail Page Wireframe</title>
    <style>
      body {
        margin: 0;
        font-family: sans-serif;
        background: #f5f5f5;
        color: #222;
      }
      .section {
        border: 2px solid #000;
        background: #fff;
        margin: 20px;
        padding: 15px;
      }
      .header,
      .footer {
        background: #e0e0e0;
      }
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .card {
        flex: 1 1 45%;
        border: 1px solid #000;
        background: #fafafa;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <div class="section header"><strong>Header (static)</strong></div>

    <!-- Header image and title – dynamic from GET /api/services/:slug -->
    <div class="section hero"><strong>Hero (dynamic title, subtitle, image)</strong></div>

    <!-- About block – dynamic content (about.title, description, image) -->
    <div class="section about"><strong>About Section (dynamic)</strong></div>

    <!-- Multiple content sections – each may contain image, text, bullet list – data from API -->
    <div class="section sections">
      <div class="grid">
        <div class="card">Section 1 (dynamic image, text, list)</div>
        <div class="card">Section 2 (dynamic image, text, list)</div>
      </div>
    </div>

    <!-- Benefits list – dynamic array of strings – GET /api/services/:slug -->
    <div class="section benefits"><strong>Benefits (dynamic)</strong></div>

    <!-- FAQ accordion – dynamic Q&A – GET /api/services/:slug -->
    <div class="section faq"><strong>FAQ (dynamic)</strong></div>

    <div class="section footer"><strong>Footer (static)</strong></div>
  </body>
</html>
